<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KalitaVerse</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Main CSS -->
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>

  <!-- Background KV -->
  <div class="bg-logo">KV</div>

  <main class="container">

    <header>
      <h1>KalitaVerse</h1>
      <p class="subtitle">Content · Gaming · Niche</p>
    </header>

    <section class="cards">
      <a href="https://youtube.com/@kalitaverse" target="_blank" class="card">
        <i class="fa-brands fa-youtube youtube"></i>
        <span>Main</span>
      </a>

      <a href="https://youtube.com/@kalitaversegaming" target="_blank" class="card">
        <i class="fa-brands fa-youtube youtube"></i>
        <span>Gaming</span>
      </a>

      <a href="https://youtube.com/@kalitaverseniche" target="_blank" class="card">
        <i class="fa-brands fa-youtube youtube"></i>
        <span>Niche</span>
      </a>
    </section>

    <section class="cta">
      <a href="https://kalitaverse.in" target="_blank" class="memes-btn">
        MEMES
      </a>
    </section>

    <div class="festival-bar">
      <button class="fest-btn diwali" onclick="fest('diwali')">🪔 Diwali</button>
      <button class="fest-btn holi" onclick="fest('holi')">🎨 Holi</button>
      <button class="fest-btn dussehra" onclick="fest('dussehra')">🏹 Dussehra</button>
      <button class="fest-btn navratri" onclick="fest('navratri')">💃 Navratri</button>
      <button class="fest-btn bihu" onclick="fest('bihu')">🌾 Bihu</button>
      <button class="fest-btn kumbh" onclick="fest('kumbh')">🔱 Kumbh Mela</button>
      <button class="fest-btn pongal" onclick="fest('pongal')">🌸 Pongal</button>
      <button class="fest-btn onam" onclick="fest('onam')">🐍 Onam</button>
      <button class="fest-btn eid" onclick="fest('eid')">🌙 Eid</button>
      <button class="fest-btn christmas" onclick="fest('christmas')">🎄 Christmas</button>
    </div>

    <section class="socials">
      <a href="https://github.com/KalitaVerse" target="_blank" class="social gh">
        <i class="fa-brands fa-github"></i>
      </a>
      <a href="https://instagram.com/kalitaversecollection" target="_blank" class="social ig">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://twitter.com/kalitaVerse" target="_blank" class="social tw">
        <i class="fa-brands fa-x-twitter"></i>
      </a>
      <a href="https://reddit.com/u/kalitaVerse" target="_blank" class="social rd">
        <i class="fa-brands fa-reddit-alien"></i>
      </a>
    </section>

    <footer>© 2026 KalitaVerse</footer>

  </main>

  <!-- FESTIVAL JS (FIXED + CACHE BUSTED) -->
  <script src="./festive.js?v=10"></script>

</body>
</html>
